name: Dependency compatibility

on:
  schedule:
    - cron: '20 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: sympress/workflows/.github/workflows/dependency-canary.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2
    with:
      php_version: '8.5'
