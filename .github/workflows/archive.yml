name: WordPress Archive

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Version written to plugin headers.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

jobs:
  archive:
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: sympress/workflows/.github/workflows/wordpress-archive.yml@78d083a9a0176cf0252318b0c69fc64938a727d6
    with:
      artifact_attestation: false
      artifact_extra_excludes: >-
        /tests /docs /AGENTS.md /CONTRIBUTING.md /qa-adoption.json
        /phpcs.xml /phpcs.xml.dist /phpstan.neon /phpstan.neon.dist
        /phpunit*.xml* /.php-cs-fixer* /.gitignore /.gitattributes
        /composer.review*.json /composer.review*.lock
      main_file: migration.php
      package_version: ${{ github.event.inputs.version }}
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}

  archive-check:
    needs: archive
    uses: sympress/workflows/.github/workflows/wordpress-archive-check.yml@78d083a9a0176cf0252318b0c69fc64938a727d6
    with:
      artifact_name: ${{ needs.archive.outputs.artifact }}
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
